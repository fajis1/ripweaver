name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_cuda:
        description: 'Build CUDA version (requires self-hosted runner)'
        required: false
        default: false
        type: boolean

env:
  # Increase disk space awareness
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # CPU builds on GitHub-hosted runners
  build-cpu:
    name: Build CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            output_name: RipWeaver-Windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            output_name: RipWeaver-Linux-x64
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      # Free up disk space on Linux runners
      - name: Free Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h

      - name: Verify reviewed frontend bundle
        shell: bash
        run: |
          test -s mkv_episode_matcher/frontend/dist/index.html
          grep -R -F -q "Current recovery status" mkv_episode_matcher/frontend/dist/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Install PyInstaller
        run: |
          uv pip install pyinstaller

      - name: Build Executable
        run: |
          uv run pyinstaller mkv_match.spec --clean

      - name: Check build output
        shell: bash
        run: |
          echo "Build output:"
          ls -la dist/
          if [ -d "dist/RipWeaver" ]; then
            echo "Contents of RipWeaver folder:"
            ls -la dist/RipWeaver/ | head -50
            echo "Total size:"
            du -sh dist/RipWeaver/
          fi

      - name: Add portable documentation
        shell: bash
        run: |
          cp docs/PORTABLE_INSTALL.md dist/RipWeaver/README.txt
          cp LICENSE dist/RipWeaver/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/RipWeaver/THIRD_PARTY_NOTICES.txt

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) { throw 'makensis.exe was not installed.' }
          $version = uv run python -c "import mkv_episode_matcher; print(mkv_episode_matcher.__version__)"
          $source = (Resolve-Path -LiteralPath 'dist\RipWeaver').Path
          $output = Join-Path (Resolve-Path -LiteralPath 'dist').Path 'RipWeaver-Setup-Windows-x64.exe'
          $license = (Resolve-Path -LiteralPath 'LICENSE').Path
          & $makensis "/DAPP_VERSION=$version" "/DSOURCE_DIR=$source" "/DOUTPUT_FILE=$output" "/DLICENSE_FILE=$license" 'installer\windows\RipWeaver.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'The NSIS installer build failed.' }

      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          7z a -tzip "${{ matrix.output_name }}.zip" "RipWeaver"

      - name: Create Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "${{ matrix.output_name }}.tar.gz" RipWeaver

      - name: Smoke test Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("RipWeaver portable {0} test" -f [char]0x03A9)
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -LiteralPath "dist\${{ matrix.output_name }}.zip" -DestinationPath $smokeRoot
          $executable = Join-Path $smokeRoot 'RipWeaver\RipWeaver.exe'
          & $executable --portable-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'The packaged RipWeaver smoke test failed.' }

      - name: Smoke test Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unicode_char="$(printf '\u03A9')"
          smoke_root="$RUNNER_TEMP/RipWeaver portable $unicode_char test"
          mkdir -p "$smoke_root"
          tar -xzf "dist/${{ matrix.output_name }}.tar.gz" -C "$smoke_root"
          "$smoke_root/RipWeaver/RipWeaver" --portable-smoke-test

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP ("RipWeaver installer {0} test" -f [char]0x03A9)
          $setup = (Resolve-Path -LiteralPath 'dist\RipWeaver-Setup-Windows-x64.exe').Path
          if (Test-Path -LiteralPath $installRoot) { throw 'The installer smoke directory already exists.' }
          $installProcess = Start-Process -FilePath $setup -ArgumentList "/S /D=$installRoot" -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) { throw "The RipWeaver installer exited with code $($installProcess.ExitCode)." }
          $executable = Join-Path $installRoot 'RipWeaver.exe'
          & $executable --portable-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'The installed RipWeaver smoke test failed.' }
          $uninstaller = Join-Path $installRoot 'Uninstall.exe'
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($uninstallProcess.ExitCode -ne 0) { throw "The RipWeaver uninstaller exited with code $($uninstallProcess.ExitCode)." }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path -LiteralPath $executable); $attempt += 1) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $executable) { throw 'The uninstaller left the RipWeaver executable behind.' }

      - name: Create SHA-256 checksum
        run: |
          uv run python -c "import hashlib; from pathlib import Path; p = Path(r'dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}'); digest = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(); p.with_name(p.name + '.sha256').write_text(f'{digest}  {p.name}\n', encoding='ascii')"

      - name: Create Windows installer SHA-256 checksum
        if: runner.os == 'Windows'
        run: |
          uv run python -c "import hashlib; from pathlib import Path; p = Path(r'dist/RipWeaver-Setup-Windows-x64.exe'); digest = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(); p.with_name(p.name + '.sha256').write_text(f'{digest}  {p.name}\n', encoding='ascii')"

      - name: Attest portable archive
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}

      - name: Attest Windows installer
        if: runner.os == 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: dist/RipWeaver-Setup-Windows-x64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}
            dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}.sha256
            dist/RipWeaver-Setup-Windows-x64.exe
            dist/RipWeaver-Setup-Windows-x64.exe.sha256
          retention-days: 30

  # CUDA builds on self-hosted runners (optional)
  build-cuda:
    name: Build CUDA (${{ matrix.os }})
    if: ${{ github.event.inputs.build_cuda == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: [self-hosted, windows, cuda]
            output_name: RipWeaver-Windows-x64-CUDA
            archive_ext: zip
          - os: linux
            runner: [self-hosted, linux, cuda]
            output_name: RipWeaver-Linux-x64-CUDA
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Verify reviewed frontend bundle
        shell: bash
        run: |
          test -s mkv_episode_matcher/frontend/dist/index.html
          grep -R -F -q "Current recovery status" mkv_episode_matcher/frontend/dist/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Verify CUDA availability
        run: |
          uv run python -c "import ctranslate2; print(f'CUDA available: {ctranslate2.get_cuda_device_count() > 0}'); print(f'CUDA device count: {ctranslate2.get_cuda_device_count()}')"

      - name: Install PyInstaller
        run: |
          uv pip install pyinstaller

      - name: Build Executable
        run: |
          uv run pyinstaller mkv_match.spec --clean

      - name: Add portable documentation
        shell: bash
        run: |
          cp docs/PORTABLE_INSTALL.md dist/RipWeaver/README.txt
          cp LICENSE dist/RipWeaver/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/RipWeaver/THIRD_PARTY_NOTICES.txt

      - name: Create Archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path "RipWeaver" -DestinationPath "${{ matrix.output_name }}.zip"

      - name: Create Archive (Linux)
        if: matrix.os == 'linux'
        run: |
          cd dist
          tar -czf "${{ matrix.output_name }}.tar.gz" RipWeaver

      - name: Smoke test Windows portable archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("RipWeaver portable {0} test" -f [char]0x03A9)
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -LiteralPath "dist\${{ matrix.output_name }}.zip" -DestinationPath $smokeRoot
          $executable = Join-Path $smokeRoot 'RipWeaver\RipWeaver.exe'
          & $executable --portable-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'The packaged RipWeaver smoke test failed.' }

      - name: Smoke test Linux portable archive
        if: matrix.os == 'linux'
        shell: bash
        run: |
          unicode_char="$(printf '\u03A9')"
          smoke_root="$RUNNER_TEMP/RipWeaver portable $unicode_char test"
          mkdir -p "$smoke_root"
          tar -xzf "dist/${{ matrix.output_name }}.tar.gz" -C "$smoke_root"
          "$smoke_root/RipWeaver/RipWeaver" --portable-smoke-test

      - name: Create SHA-256 checksum
        run: |
          uv run python -c "import hashlib; from pathlib import Path; p = Path(r'dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}'); digest = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(); p.with_name(p.name + '.sha256').write_text(f'{digest}  {p.name}\n', encoding='ascii')"

      - name: Attest portable archive
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}
            dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}.sha256
          retention-days: 30

  # Create release when triggered by a tag
  release:
    needs: [build-cpu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
