name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_cuda:
        description: 'Build CUDA version (requires self-hosted runner)'
        required: false
        default: false
        type: boolean

env:
  # Increase disk space awareness
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # CPU builds on GitHub-hosted runners
  build-cpu:
    name: Build CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            output_name: RipWeaver-Windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            output_name: RipWeaver-Linux-x64
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      # Free up disk space on Linux runners
      - name: Free Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h

      - name: Verify reviewed frontend bundle
        shell: bash
        run: |
          test -s mkv_episode_matcher/frontend/dist/index.html
          grep -R -F -q "Current recovery status" mkv_episode_matcher/frontend/dist/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Install PyInstaller
        run: |
          uv pip install pyinstaller

      - name: Build Executable
        run: |
          uv run pyinstaller mkv_match.spec --clean

      - name: Check build output
        shell: bash
        run: |
          echo "Build output:"
          ls -la dist/
          if [ -d "dist/RipWeaver" ]; then
            echo "Contents of RipWeaver folder:"
            ls -la dist/RipWeaver/ | head -50
            echo "Total size:"
            du -sh dist/RipWeaver/
          fi

      - name: Add portable documentation
        shell: bash
        run: |
          cp docs/PORTABLE_INSTALL.md dist/RipWeaver/README.txt
          cp LICENSE dist/RipWeaver/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/RipWeaver/THIRD_PARTY_NOTICES.txt

      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          7z a -tzip "${{ matrix.output_name }}.zip" "RipWeaver"

      - name: Create Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "${{ matrix.output_name }}.tar.gz" RipWeaver

      - name: Smoke test Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("RipWeaver portable {0} test" -f [char]0x03A9)
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -LiteralPath "dist\${{ matrix.output_name }}.zip" -DestinationPath $smokeRoot
          $executable = Join-Path $smokeRoot 'RipWeaver\RipWeaver.exe'
          & $executable --portable-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'The packaged RipWeaver smoke test failed.' }

      - name: Smoke test Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unicode_char="$(printf '\u03A9')"
          smoke_root="$RUNNER_TEMP/RipWeaver portable $unicode_char test"
          mkdir -p "$smoke_root"
          tar -xzf "dist/${{ matrix.output_name }}.tar.gz" -C "$smoke_root"
          "$smoke_root/RipWeaver/RipWeaver" --portable-smoke-test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}
          retention-days: 30

  # CUDA builds on self-hosted runners (optional)
  build-cuda:
    name: Build CUDA (${{ matrix.os }})
    if: ${{ github.event.inputs.build_cuda == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: [self-hosted, windows, cuda]
            output_name: RipWeaver-Windows-x64-CUDA
            archive_ext: zip
          - os: linux
            runner: [self-hosted, linux, cuda]
            output_name: RipWeaver-Linux-x64-CUDA
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Verify reviewed frontend bundle
        shell: bash
        run: |
          test -s mkv_episode_matcher/frontend/dist/index.html
          grep -R -F -q "Current recovery status" mkv_episode_matcher/frontend/dist/assets

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Verify CUDA availability
        run: |
          uv run python -c "import ctranslate2; print(f'CUDA available: {ctranslate2.get_cuda_device_count() > 0}'); print(f'CUDA device count: {ctranslate2.get_cuda_device_count()}')"

      - name: Install PyInstaller
        run: |
          uv pip install pyinstaller

      - name: Build Executable
        run: |
          uv run pyinstaller mkv_match.spec --clean

      - name: Add portable documentation
        shell: bash
        run: |
          cp docs/PORTABLE_INSTALL.md dist/RipWeaver/README.txt
          cp LICENSE dist/RipWeaver/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/RipWeaver/THIRD_PARTY_NOTICES.txt

      - name: Create Archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path "RipWeaver" -DestinationPath "${{ matrix.output_name }}.zip"

      - name: Create Archive (Linux)
        if: matrix.os == 'linux'
        run: |
          cd dist
          tar -czf "${{ matrix.output_name }}.tar.gz" RipWeaver

      - name: Smoke test Windows portable archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("RipWeaver portable {0} test" -f [char]0x03A9)
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -LiteralPath "dist\${{ matrix.output_name }}.zip" -DestinationPath $smokeRoot
          $executable = Join-Path $smokeRoot 'RipWeaver\RipWeaver.exe'
          & $executable --portable-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'The packaged RipWeaver smoke test failed.' }

      - name: Smoke test Linux portable archive
        if: matrix.os == 'linux'
        shell: bash
        run: |
          unicode_char="$(printf '\u03A9')"
          smoke_root="$RUNNER_TEMP/RipWeaver portable $unicode_char test"
          mkdir -p "$smoke_root"
          tar -xzf "dist/${{ matrix.output_name }}.tar.gz" -C "$smoke_root"
          "$smoke_root/RipWeaver/RipWeaver" --portable-smoke-test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}.${{ matrix.archive_ext }}
          retention-days: 30

  # Create release when triggered by a tag
  release:
    needs: [build-cpu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
